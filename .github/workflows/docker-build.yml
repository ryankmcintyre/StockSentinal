name: Docker Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t stocksentinal:test .

      - name: Test image startup
        run: |
          docker run -d \
            -p 8000:8000 \
            -e ALPHA_VANTAGE_API_KEY=test_key \
            -e LOG_LEVEL=INFO \
            --name stocksentinal-test \
            stocksentinal:test

          # Wait for app to start and check health
          echo "Waiting for app to start..."
          sleep 5
          
          echo "Testing health check..."
          if curl -f -s http://localhost:8000/health | grep -q "Stock Sentinel"; then
            echo "✓ App is running and responding!"
            curl -s http://localhost:8000/health
            docker stop stocksentinal-test
          else
            echo "✗ App failed to respond correctly"
            docker logs stocksentinal-test
            exit 1
          fi

      - name: Verify image layers
        run: |
          docker inspect stocksentinal:test | grep -E "Architecture|Os"
