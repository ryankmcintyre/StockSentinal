<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Stock Sentinel{% endblock %}</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <script>
        (function () {
            var preference = "system";
            try {
                var storedPreference = window.localStorage.getItem("themePreference");
                if (
                    storedPreference === "light" ||
                    storedPreference === "dark" ||
                    storedPreference === "system"
                ) {
                    preference = storedPreference;
                }
            } catch (_error) {
                preference = "system";
            }
            var resolvedTheme = preference;
            if (preference === "system" && window.matchMedia) {
                resolvedTheme = window.matchMedia("(prefers-color-scheme: dark)").matches
                    ? "dark"
                    : "light";
            }
            document.documentElement.dataset.themePreference = preference;
            document.documentElement.dataset.theme =
                resolvedTheme === "dark" ? "dark" : "light";
        }());
    </script>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <header class="site-header">
        <nav class="site-nav">
            <div class="nav-left">
                <a href="/" class="brand" aria-label="Stock Sentinel home">
                    <span class="brand-mark" aria-hidden="true">
                        <span class="brand-bar brand-bar-short"></span>
                        <span class="brand-bar brand-bar-medium"></span>
                        <span class="brand-bar brand-bar-tall"></span>
                    </span>
                    <span class="brand-copy">
                        <span class="brand-name">Stock Sentinel</span>
                        <span class="brand-tagline">Sell · Trim · Hold</span>
                    </span>
                </a>
                {% if current_user %}
                <a href="/rules" class="btn btn-small">Rules</a>
                {% if current_user.is_admin %}
                <a href="/admin" class="btn btn-small">Admin</a>
                {% endif %}
                {% endif %}
            </div>
            <div class="nav-right">
                {% if current_user %}
                <a href="/add" class="btn btn-primary">+ Add Position</a>
                <details class="profile-menu">
                    <summary class="profile-button" aria-label="Profile">
                        <svg class="profile-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="12" cy="12" r="9"></circle>
                            <circle cx="12" cy="8.25" r="3.25"></circle>
                            <path d="M6.5 18.5a5.5 5.5 0 0 1 11 0"></path>
                        </svg>
                    </summary>
                    <div class="theme-menu" aria-label="Profile menu">
                        <details class="theme-submenu">
                            <summary class="profile-menu-item theme-submenu-summary">
                                <span class="theme-submenu-label">Theme</span>
                                <span class="theme-submenu-chevron" aria-hidden="true">›</span>
                            </summary>
                            <div class="theme-submenu-options" aria-label="Theme">
                                <button type="button" class="theme-menu-option" aria-pressed="false" data-theme-option="system">
                                    <span>System</span>
                                    <span class="theme-menu-check" aria-hidden="true">✓</span>
                                </button>
                                <button type="button" class="theme-menu-option" aria-pressed="false" data-theme-option="light">
                                    <span>Light</span>
                                    <span class="theme-menu-check" aria-hidden="true">✓</span>
                                </button>
                                <button type="button" class="theme-menu-option" aria-pressed="false" data-theme-option="dark">
                                    <span>Dark</span>
                                    <span class="theme-menu-check" aria-hidden="true">✓</span>
                                </button>
                            </div>
                        </details>
                        <form method="post" action="/auth/logout" class="profile-menu-form">
                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                            <button type="submit" class="profile-menu-item">Sign Out</button>
                        </form>
                    </div>
                </details>
                {% else %}
                <a href="/auth/login" class="btn btn-primary">Sign In</a>
                {% endif %}
            </div>
        </nav>
    </header>
    <main class="{% block main_class %}{% endblock %}">
        {% if flash %}
        <section class="alert alert-info">{{ flash }}</section>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
        <a href="/privacy">Privacy Statement</a>
        <span class="footer-sep">·</span>
        <a href="mailto:admin@stocksentinal.com">Contact</a>
    </footer>
    <script src="/static/theme.js" defer></script>
    <script src="/static/refresh-status.js" defer></script>
</body>
</html>
