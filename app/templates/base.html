<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}StockSentinal{% endblock %}</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <header class="site-header">
        <nav class="site-nav">
            <div class="nav-left">
                <a href="/" class="brand" aria-label="StockSentinal home">
                    <span class="brand-mark" aria-hidden="true">
                        <span class="brand-bar brand-bar-short"></span>
                        <span class="brand-bar brand-bar-medium"></span>
                        <span class="brand-bar brand-bar-tall"></span>
                    </span>
                    <span class="brand-copy">
                        <span class="brand-name">StockSentinal</span>
                        <span class="brand-tagline">Sell · Trim · Hold</span>
                    </span>
                </a>
                <a href="/rules" class="btn btn-small">Rules</a>
            </div>
            <a href="/add" class="btn btn-primary">+ Add Position</a>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <script src="/static/refresh-status.js" defer></script>
</body>
</html>
