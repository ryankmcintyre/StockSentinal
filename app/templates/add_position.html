{% extends "base.html" %}
{% block title %}Add Position — Stock Sentinel{% endblock %}
{% block content %}

<h2>Add Position</h2>

<form method="post" action="/add" class="position-form">
    <div class="form-group">
        <label for="ticker">Ticker</label>
        <input type="text" id="ticker" name="ticker" required maxlength="10" placeholder="AAPL">
    </div>

    <div class="form-group">
        <label for="company_name">Company Name</label>
        <input type="text" id="company_name" name="company_name" required placeholder="Apple Inc.">
    </div>

    <div class="form-group">
        <label for="cost_basis">Cost Basis ($)</label>
        <input type="number" id="cost_basis" name="cost_basis" required min="0.01" step="0.01" placeholder="150.00">
    </div>

    <div class="form-group">
        <label for="current_price">Current Price ($)</label>
        <input type="number" id="current_price" name="current_price" required min="0.01" step="0.01" placeholder="175.00">
    </div>

    <div class="form-group">
        <label for="initial_purchase_date">Purchase Date</label>
        <input type="date" id="initial_purchase_date" name="initial_purchase_date" required>
    </div>

    <div class="form-group">
        <label for="investment_type">Investment Type</label>
        <select id="investment_type" name="investment_type" required>
            {% for t in investment_types %}
            <option value="{{ t.value }}">{{ t.value }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group">
        <label for="notes">Notes (optional)</label>
        <textarea id="notes" name="notes" rows="3" placeholder="Any notes about this position..."></textarea>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Add Position</button>
        <a href="/" class="btn">Cancel</a>
    </div>
</form>

{% endblock %}
