services:
  - type: web
    name: stocksentinal
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: LOG_LEVEL
        value: INFO
      - key: ALPHA_VANTAGE_API_KEY
        scope: run
      - key: DATABASE_URL
        value: sqlite:////var/data/stocksentinal.db
    disk:
      - name: data
        mountPath: /var/data
        sizeGB: 1
